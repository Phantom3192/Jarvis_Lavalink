server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "${LAVALINK_PASSWORD}"
    sources:
      youtube: false
      soundcloud: false
      http: true
      twitch: false
      vimeo: false
      nico: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 5
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    playerUpdateInterval: 5
    useSeekGhosting: true
    gc-warnings: true
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
    - dependency: "com.github.topi314.lavasearch:lavasearch-plugin:1.0.0"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.infnibor.lavasrc:lavasrc-plugin:08f7f9e"
      repository: "https://maven.pcreators.pl/snapshots"

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - "TVHTML5_SIMPLY"
      - "TV"
      - "ANDROID_VR"
      - "ANDROID"
      - "ANDROID_MUSIC"
      - "MUSIC"
      - "WEBEMBEDDED"
      - "MWEB"
      - "WEB"
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
    remotePot:
      url: "http://localhost:8080"
    oauth:
      enabled: true
      refreshToken: "${YT_REFRESH_TOKEN:}"
      skipInitialization: true
  lavasrc:
    providers:
      - 'ytsearch:"%ISRC%"'
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      jiosaavn: false
      ytdlp: false
      youtube: true
    spotify:
      countryCode: "${SPOTIFY_COUNTRY_CODE:IN}"

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
