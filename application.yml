lavalink:
  plugins:
  - dependency: "dev.lavalink.youtube:youtube-plugin:42cc5a2042f31dba3fdc523618ef380a1a8bb79d"
    snapshot: true
  - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
    repository: "https://maven.lavalink.dev/releases"
    snapshot: false
  
  server:
    address: 0.0.0.0
    port: 26135
    password: ${LAVALINK_SERVER_PASSWORD}  # ✅ CHANGED: Added password
    
    # ===== PERSISTENT CONNECTION SETTINGS =====
    
    # Session settings - keep alive forever
    session:
      defaultTimeout: 3600000  # 1 hour in milliseconds
      maxTimeout: 86400000     # 24 hours max
    
    # Voice connection settings
    voice:
      connectionTimeout: 30000      # Increased to 30 seconds
      keepAliveInterval: 5000       # Keep-alive every 5 seconds
      udpKeepAlive: true
      reconnectAttempts: 999        # Retry forever
      reconnectDelay: 2000          # 2 second delay between retries
    
    # UDP settings
    udp:
      bufferSize: 4096              # Increased buffer
      timeout: 60000                # 60 second timeout
    
    # Player settings - never give up
    playerUpdateInterval: 1         # Update every second
    trackStuckThresholdMs: 30000    # 30 seconds before track is stuck
    
    # Buffer settings
    bufferDurationMs: 2000
    frameBufferDurationMs: 7500
    gc-warnings: true
    nonAllocatingFrameBuffer: true
    opusEncodingQuality: 8
    resamplingQuality: MEDIUM
    soundcloudSearchEnabled: true
    
    sources:
      bandcamp: true
      http: true
      local: true
      nico: false
      soundcloud: false
      twitch: true
      vimeo: true
      youtube: false
    
    timeouts:
      connectTimeoutMs: 10000       # 10 second connect timeout
      connectionRequestTimeoutMs: 10000
      socketTimeoutMs: 30000        # 30 second socket timeout
    
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    youtubeSearchEnabled: true

logging:
  file:
    path: ./logs/
  level:
    lavalink: INFO
    com.sedmelluq.lava: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
    root: INFO
  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

plugins:
  youtube:
    allowDirectPlaylistIds: true
    allowDirectVideoIds: true
    allowSearch: true
    clientOptions:
      ANDROID_MUSIC:
        playback: true
        playlistLoading: false
        searching: true
        videoLoading: true
      ANDROID_VR:
        playback: true
        playlistLoading: true
        searching: true
        videoLoading: true
      IOS:
        playback: true
        playlistLoading: true
        searching: true
        videoLoading: true
      MUSIC:
        playback: true
        playlistLoading: false
        searching: true
        videoLoading: true
      MWEB:
        playback: true
        playlistLoading: true
        searching: true
        videoLoading: true
      TV:
        playback: true
        playlistLoading: true
        searching: true
        videoLoading: true
      TVHTML5EMBEDDED:
        playback: false
        playlistLoading: false
        searching: true
        videoLoading: true
      WEB:
        playback: true
        playlistLoading: true
        searching: true
        videoLoading: true
      WEBEMBEDDED:
        playback: true
        playlistLoading: false
        searching: false
        videoLoading: true
    clients:
    - MUSIC
    - ANDROID_VR
    - WEB
    - MWEB
    - ANDROID_MUSIC
    - TVHTML5_SIMPLY
    - TV
    enabled: true
    oauth:
      enabled: true
      refreshToken: ${YT_REFRESH_TOKEN}
      skipInitialization: false
    remotePot:
      url: "http://127.0.0.1:8080"
    remoteCipher:
      url: "https://cipher.kikkia.dev/"

sentry:
  dsn: ''
  environment: ''

server:
  address: 0.0.0.0
  http2:
    enabled: false
  port: 26135
