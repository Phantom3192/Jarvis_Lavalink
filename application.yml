lavalink:
  plugins:
  - dependency: "dev.lavalink.youtube:youtube-plugin:42cc5a2042f31dba3fdc523618ef380a1a8bb79d"
    snapshot: true
  - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
    repository: "https://maven.lavalink.dev/releases"
    snapshot: false
  server:
    bufferDurationMs: 400
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    frameBufferDurationMs: 1000
    gc-warnings: true
    nonAllocatingFrameBuffer: false
    opusEncodingQuality: 10
    password: ${LAVALINK_PASSWORD}
    playerUpdateInterval: 1
    resamplingQuality: LOW
    soundcloudSearchEnabled: true
    sources:
      bandcamp: true
      http: true
      local: true
      nico: false
      soundcloud: true
      twitch: true
      vimeo: true
      youtube: false
    timeouts:
      connectTimeoutMs: 3000
      connectionRequestTimeoutMs: 3000
      socketTimeoutMs: 3000
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    youtubeSearchEnabled: true
logging:
  file:
    path: ./logs/
  level:
    lavalink: INFO
    root: INFO
  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30
metrics:
  prometheus:
    enabled: false
    endpoint: /metrics
plugins:
  youtube:
    allowDirectPlaylistIds: true
    allowDirectVideoIds: true
    allowSearch: true
    clientOptions:
      ANDROID_MUSIC:
        playback: true
        playlistLoading: false
        searching: true
        videoLoading: true
      ANDROID_VR:
        playback: true
        playlistLoading: true
        searching: true
        videoLoading: true
      IOS:
        playback: true
        playlistLoading: true
        searching: true
        videoLoading: true
      MUSIC:
        playback: true
        playlistLoading: false
        searching: true
        videoLoading: true
      MWEB:
        playback: true
        playlistLoading: true
        searching: true
        videoLoading: true
      TV:
        playback: false
        playlistLoading: false
        searching: false
        videoLoading: false
      TVHTML5EMBEDDED:
        playback: false
        playlistLoading: false
        searching: true
        videoLoading: true
      WEB:
        playback: true
        playlistLoading: true
        searching: true
        videoLoading: true
      WEBEMBEDDED:
        playback: true
        playlistLoading: false
        searching: false
        videoLoading: true
    clients:
    - MUSIC
    - ANDROID_VR
    - WEB
    - MWEB
    - ANDROID_MUSIC
    - TVHTML5_SIMPLY
    - TV
    enabled: true
    oauth:
      enabled: true
      refreshToken: ${YT_REFRESH_TOKEN}
      skipInitialization: true
    remotePot:
      url: "http://127.0.0.1:8080"
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
sentry:
  dsn: ''
  environment: ''
server:
  address: 0.0.0.0
  http2:
    enabled: false
  port: 2333
